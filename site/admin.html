<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - M Soluction</title>
    <style>
        body { font-family: sans-serif; background: #0a0a0a; color: #fff; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        input, button { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; }
        button { background: #fff; color: #000; border: none; cursor: pointer; font-weight: bold; }
        .hidden { display: none; }
        .ticket { background: #1a1a1a; padding: 15px; margin-bottom: 10px; border-left: 4px solid #fff; }
        .ticket-meta { font-size: 0.8em; color: #888; margin-bottom: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <div id="login-screen">
            <h1>Acesso Restrito</h1>
            <p>Digite a chave de acesso para ver os pedidos de ajuda.</p>
            <input type="password" id="admin-key" placeholder="Chave de Acesso">
            <button onclick="checkKey()">Entrar</button>
        </div>

        <div id="admin-panel" class="hidden">
            <h1>Pedidos de Ajuda</h1>
            <p>Lista de relatos enviados pelos usuários via app instalador.</p>
            <div id="tickets-list">
                <!-- Tickets will be loaded here -->
            </div>
            <button onclick="clearTickets()" style="background: #333; color: #fff; margin-top: 20px;">Limpar Lista (Local)</button>
        </div>
    </div>

    <script>
        const SECRET_KEY = "msoluction2026";

        function checkKey() {
            const input = document.getElementById('admin-key').value;
            if (input === SECRET_KEY) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                loadTickets();
            } else {
                alert("Chave incorreta.");
            }
        }

        function loadTickets() {
            const list = document.getElementById('tickets-list');
            // In a real app, this would fetch from an API.
            // Since this is static, we simulate reading from localStorage or just show a message.
            // For demo purposes, let's assume the installer sent data to localStorage (which it can't cross-origin easily without a backend).
            // So we will just show a placeholder or check if there's any global variable set by a hypothetical backend.

            // Simulating data for now since we don't have a backend yet.
            const mockTickets = [
                { model: "HY320", android: "12", error: "ERR_MANIFEST", msg: "Tela preta após instalar", date: new Date().toLocaleString() },
                { model: "HY300", android: "11", error: "NONE", msg: "Controle não funciona no YouTube", date: new Date().toLocaleString() }
            ];

            list.innerHTML = "";
            if (mockTickets.length === 0) {
                list.innerHTML = "<p>Nenhum pedido de ajuda encontrado.</p>";
                return;
            }

            mockTickets.forEach(t => {
                const div = document.createElement('div');
                div.className = 'ticket';
                div.innerHTML = `
                    <div class="ticket-meta">${t.date} | ${t.model} | Android ${t.android}</div>
                    <strong>Erro:</strong> ${t.error}<br>
                    <strong>Mensagem:</strong> ${t.msg}
                `;
                list.appendChild(div);
            });
        }

        function clearTickets() {
            if(confirm("Tem certeza?")) {
                document.getElementById('tickets-list').innerHTML = "<p>Lista limpa.</p>";
            }
        }
    </script>
</body>
</html>
