name: Testes

on:
  push:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Testes do app
        run: |
          for t in app/tests/test_*.py; do
            echo "::group::$t"
            python3 "$t"
            echo "::endgroup::"
          done

      - name: Teste de sincronizacao
        run: bash scripts/testar-sincronizacao.sh
