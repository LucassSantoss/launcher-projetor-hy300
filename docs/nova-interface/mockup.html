<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Mockup — nova tela inicial</title>
<style>
@font-face{font-family:Inter;src:url(../../app/assets/fonts/Inter.ttf)}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1280px;height:720px;overflow:hidden;font-family:Inter,sans-serif;color:#F5F5F7;
 background:#050507}
.screen{position:relative;width:1280px;height:720px;overflow:hidden;
 background:
  radial-gradient(600px 420px at 18% 8%, rgba(74,108,240,.45), transparent 70%),
  radial-gradient(700px 520px at 100% 100%, rgba(160,75,216,.35), transparent 70%),
  linear-gradient(135deg,#0B1022,#140E22 55%,#050507)}
/* tinta do app focado (Ui.appColor) atras do destaque */
.tint{position:absolute;inset:0 0 auto 0;height:380px;
 background:radial-gradient(760px 340px at 72% 0%, var(--tint) , transparent 72%);opacity:.55}
.top{position:absolute;left:56px;right:56px;top:26px;height:40px;display:flex;align-items:center;gap:14px}
.clock{font-size:30px;font-weight:300;letter-spacing:-.5px}
.date{font-size:15px;color:#98989D;font-weight:500}
.sp{flex:1}
.chip{height:36px;min-width:36px;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:8px;
 background:rgba(44,44,46,.55);border:1px solid rgba(255,255,255,.12);font-size:13px;color:#d0d0d5;padding:0 12px}
.chip svg{width:18px;height:18px}
.hero{position:absolute;left:56px;top:96px;width:720px}
.kind{font-size:14px;font-weight:600;color:#0A84FF;letter-spacing:.3px;text-transform:uppercase}
.name{font-size:46px;font-weight:700;letter-spacing:-1px;margin-top:8px}
.desc{font-size:16px;color:#b8b8bf;margin-top:10px;line-height:1.45}
.rings{position:absolute;right:56px;top:104px;display:flex;gap:18px}
.ring{width:58px;text-align:center;font-size:11px;color:#98989D}
.ring div{width:50px;height:50px;margin:0 auto 6px;border-radius:50%;
 background:conic-gradient(#fff var(--p), rgba(255,255,255,.14) 0);display:flex;align-items:center;justify-content:center}
.ring div span{width:42px;height:42px;border-radius:50%;background:#0f1020;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;font-weight:600}
.rows{position:absolute;left:56px;right:0;top:var(--rowsTop)}
.row{margin-bottom:22px;transition:opacity .2s}
.row.dim{opacity:.45}
.rt{font-size:17px;font-weight:600;margin-bottom:12px;display:flex;gap:10px;align-items:baseline}
.rt small{font-size:12px;color:#98989D;font-weight:500}
.items{display:flex;gap:18px;align-items:center}
.ban{width:212px;height:119px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;
 font-weight:800;font-size:26px;letter-spacing:-.5px;position:relative}
.ban.f{transform:scale(1.12);box-shadow:0 0 0 3px #fff,0 18px 40px rgba(0,0,0,.55);z-index:2;margin:0 12px}
.add{background:rgba(44,44,46,.55);border:1px dashed rgba(255,255,255,.25);font-size:40px;font-weight:300;color:#98989D}
.tile{width:150px;height:96px;border-radius:16px;flex:none;background:rgba(44,44,46,.6);border:1px solid rgba(255,255,255,.1);
 display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:13px;color:#d0d0d5;font-weight:500}
.tile svg{width:30px;height:30px;stroke:#F5F5F7;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile.f{transform:scale(1.12);background:#F5F5F7;color:#1D1D1F;box-shadow:0 14px 34px rgba(0,0,0,.5);margin:0 10px}
.tile.f svg{stroke:#1D1D1F}
.tile .st{font-size:11px;color:#98989D;margin-top:-6px}
.tile.f .st{color:#5a5a60}
.rec{width:260px;height:76px;border-radius:14px;flex:none;background:rgba(44,44,46,.6);border:1px solid rgba(255,255,255,.1);
 display:flex;align-items:center;gap:12px;padding:0 14px}
.rec i{width:44px;height:44px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;font-size:14px}
.rec b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
.rec span{font-size:12px;color:#98989D}
.hint{position:absolute;right:56px;bottom:18px;font-size:12px;color:#7a7a80;display:flex;gap:18px}
.hint b{color:#c8c8cd;font-weight:600}
.fade{position:absolute;left:0;right:0;bottom:0;height:70px;background:linear-gradient(transparent,rgba(5,5,7,.9))}
</style></head><body>
<div class="screen" id="s"></div>
<script>
const I={
wifi:'<path d="M2 8.5a15 15 0 0 1 20 0M5 12a10.5 10.5 0 0 1 14 0M8.5 15.5a5.5 5.5 0 0 1 7 0"/><circle cx="12" cy="19" r="1"/>',
bt:'<path d="M7 7l10 10-5 4V3l5 4L7 17"/>',
phone:'<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>',
gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 15H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 9 4.6V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 19.4 9H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 2z"/>',
key:'<path d="M5 6l14 0-3 12H8z"/>',
img:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/>',
hdmi:'<path d="M3 8h18v5l-3 3H6l-3-3z"/><path d="M8 11h8"/>',
apps:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
chart:'<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>',
speed:'<path d="M12 14l4-4"/><path d="M3.3 17a9 9 0 1 1 17.4 0"/>',
up:'<path d="M12 19V5M5 12l7-7 7 7"/>',
pin:'<rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',
back:'<path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/>',
tv:'<rect x="2" y="5" width="20" height="13" rx="2"/><path d="M8 21h8M9 2l3 3 3-3"/>',
};
const svg=k=>`<svg viewBox="0 0 24 24" style="stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round">${I[k]}</svg>`;
const favs=[['YouTube','#FF3B30','#fff','Vídeos','Assista vídeos, música e canais ao vivo.'],['NETFLIX','#141414','#E50914','Filmes e séries','Filmes, séries e documentários.'],
 ['Globoplay','#FF2D55','#fff','TV e novelas','Novelas, jornalismo e TV Globo ao vivo.'],['prime video','#00A8E1','#fff','Filmes e séries',''],
 ['Disney+','#0A3D91','#fff','Filmes e séries',''],['Spotify','#1DB954','#000','Música','']];
function tile(icon,label,f,st){return `<div class="tile${f?' f':''}">${svg(icon)}<div>${label}</div>${st?`<div class="st">${st}</div>`:''}</div>`}
function render(state){
 const f=state.focus; const row=f[0];
 const fav=favs[row==='fav'?f[1]:0];
 let hero;
 if(row==='fav') hero={k:fav[3],n:fav[0]==='NETFLIX'?'Netflix':fav[0],d:fav[4]+' Segure OK para mais opções.',t:fav[1]};
 else hero={k:state.hk,n:state.hn,d:state.hd,t:'#2b3a8a'};
 const rows={
  fav:{t:'Favoritos',s:'Segure OK para mover ou remover',h:`${favs.map((a,i)=>`<div class="ban${row==='fav'&&f[1]===i?' f':''}" style="background:${a[1]};color:${a[2]}">${a[0]}</div>`).join('')}<div class="ban add">+</div>`},
  rec:{t:'Continuar assistindo',h:[['Avatar: O Caminho da Água','Disney+','#0A3D91','D+'],['Jornal Nacional','Globoplay','#FF2D55','G'],['Lo-fi para estudar','YouTube','#FF3B30','▶'],['TV ao vivo · Canal 4','TV ao vivo','#5E5CE6','TV']].map(r=>`<div class="rec"><i style="background:${r[2]}">${r[3]}</i><div><b>${r[0]}</b><span>${r[1]}</span></div></div>`).join('')},
  proj:{t:'Projetor',h:[['key','Keystone'],['img','Imagem'],['hdmi','HDMI'],['tv','TV ao vivo']].map((x,i)=>tile(x[0],x[1],row==='proj'&&f[1]===i)).join('')},
  con:{t:'Conexões',h:[['wifi','Wi‑Fi','CasaLucas_5G'],['bt','Bluetooth','Ligado'],['phone','Controle no celular','PIN 4821']].map((x,i)=>tile(x[0],x[1],row==='con'&&f[1]===i,x[2])).join('')},
  sys:{t:'Sistema',h:[['gear','Ajustes do Android'],['apps','Todos os apps'],['moon','Tema claro'],['chart','Mostrar medidores'],['speed','Testar internet'],['up','Atualizar'],['pin','Novo PIN'],['back','Tela original']].map((x,i)=>tile(x[0],x[1],row==='sys'&&f[1]===i)).join('')},
 };
 const order=['fav','rec','proj','con','sys'];
 const html=order.slice(state.firstRow).map(k=>`<div class="row${k===row?'':' dim'}"><div class="rt">${rows[k].t}${rows[k].s&&k===row?`<small>${rows[k].s}</small>`:''}</div><div class="items">${rows[k].h}</div></div>`).join('');
 document.getElementById('s').innerHTML=`
 <div class="tint" style="--tint:${hero.t}"></div>
 <div class="top"><div class="clock">21:47</div><div class="date">sábado, 31 de outubro</div><div class="sp"></div>
  <div class="chip">${svg('phone')} 192.168.0.14:8080 · PIN 4821</div><div class="chip">${svg('wifi')}</div><div class="chip">${svg('bt')}</div><div class="chip">${svg('gear')}</div></div>
 <div class="hero"><div class="kind">${hero.k}</div><div class="name">${hero.n}</div><div class="desc">${hero.d}</div></div>
 ${state.rings?`<div class="rings">${[['42°','Temp.','30%'],['18%','CPU','18%'],['61%','RAM','61%'],['47%','Espaço','47%'],['86','Mbps','70%']].map(r=>`<div class="ring"><div style="--p:${r[2]}"><span>${r[0]}</span></div>${r[1]}</div>`).join('')}</div>`:''}
 <div class="rows" style="--rowsTop:${state.top}px">${html}</div>
 <div class="fade"></div>
 <div class="hint"><span><b>OK</b> abrir</span><span><b>Segure OK</b> opções</span><span><b>▲▼</b> listas</span><span><b>◀▶</b> itens</span></div>`;
}
const st=new URLSearchParams(location.search).get('s')||'1';
if(st==='1')render({focus:['fav',1],firstRow:0,top:262,rings:true});
if(st==='2')render({focus:['con',2],firstRow:2,top:262,rings:false,hk:'Conexões',hn:'Controle no celular',hd:'Mostra o QR code para usar o celular como controle. Endereço 192.168.0.14:8080 · PIN 4821.'});
if(st==='3')render({focus:['sys',0],firstRow:3,top:262,rings:false,hk:'Sistema',hn:'Ajustes do Android',hd:'Rede, som, data e hora, contas e demais ajustes do sistema.'});
</script></body></html>
